<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI CRYPTO RADAR</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">

    <header>

        <div class="logo">
            🐋
        </div>

        <div>

            <h1>
                AI CRYPTO RADAR
            </h1>

            <p>
                Binance Spot Intelligence
            </p>

        </div>

    </header>


    <!-- SYSTEM -->

    <section class="status-card">

        <div>

            <span class="status-dot"></span>

            <strong>
                SYSTEM ONLINE
            </strong>

        </div>

        <div id="binanceStatus">
            Binance: Checking...
        </div>

    </section>


    <!-- TEST -->

    <section class="test-card">

        <h2>
            🔌 اتصال Binance
        </h2>

        <div id="testResult">
            جاري الاختبار...
        </div>

    </section>


    <!-- MARKET -->

    <section class="market-card">

        <div class="section-title">

            <h2>
                📊 أعلى العملات تداولًا
            </h2>

            <span id="coinCount">
                --
            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            العملة
                        </th>

                        <th>
                            السعر
                        </th>

                        <th>
                            24H
                        </th>

                        <th>
                            Volume
                        </th>

                    </tr>

                </thead>


                <tbody id="marketTable">

                    <tr>

                        <td colspan="5">
                            جاري تحميل بيانات Binance...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <footer>

        AI CRYPTO RADAR V1.1

        <br>

        Market data only — no automatic trading

    </footer>

</div>


<script
    src="/static/dashboard.js">
</script>

</body>

</html>
